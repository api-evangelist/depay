aid: depay
name: Depay
description: Depay (Depayments S.A.) is a Latin American cross-border payment infrastructure
  company that connects banks, wallets, and fintechs to the region's instant payment
  rails through a single API integration, enabling real-time international payments
  with settlement in local currency. Depay bridges interoperability across PIX (Brazil),
  Transferencias 3.0 (Argentina), Bre-B (Colombia), QR BCR (Peru), and QR BCB (Bolivia),
  and offers QR-code collection products for online and in-person checkout. Founded
  in Buenos Aires and backed by Techstars (Payments Powered by Stellar and MoneyGram),
  the company raised a $4M round to expand its real-time payment network across LATAM.
